spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX:5}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Flyway owns the session schema to prevent duplicate creation at startup.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

nexthub.seed.enabled=${NEXTHUB_SEED_ENABLED:false}
nexthub.storage.provider=supabase
supabase.url=${SUPABASE_URL}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:nexthub-resumes}
supabase.storage.service-key=${SUPABASE_SERVICE_ROLE_KEY}

nexthub.cors.allowed-origin=${NEXTHUB_CORS_ALLOWED_ORIGIN:https://your-app.vercel.app}
