server.port=${PORT:8080}

spring.datasource.url=jdbc:sqlite:${NEXTHUB_DB_PATH:./data/nexthub.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

nexthub.cors.allowed-origin=${NEXTHUB_CORS_ALLOWED_ORIGIN:http://localhost:5173}
nexthub.seed.enabled=${NEXTHUB_SEED_ENABLED:true}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
nexthub.upload-dir=${NEXTHUB_UPLOAD_DIR:./uploads}
nexthub.storage.provider=${NEXTHUB_STORAGE_PROVIDER:local}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
